<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Ours Finance Management</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='ours-finance-mark.svg') }}">
  <style>
    :root {
      --bg: linear-gradient(135deg, #143754 0%, #1f5f91 48%, #cfe3f5 100%);
      --card: rgba(255, 255, 255, 0.96);
      --ink: #17324b;
      --muted: #66798a;
      --accent: #184f7a;
      --accent-soft: #dceaf6;
      --danger: #c74d41;
      --shadow: 0 24px 50px rgba(12, 33, 50, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
    }

    .register-card {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .icon-badge {
      width: 42px;
      height: 42px;
      display: block;
      border-radius: 14px;
      box-shadow: 0 12px 26px rgba(12, 33, 50, 0.16);
    }

    .brand-kicker {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c7d7e4;
      border-radius: 12px;
      font: inherit;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .submit-btn,
    .back-link {
      flex: 1;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .submit-btn {
      border: none;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
    }

    .back-link {
      border: 1px solid #c7d7e4;
      color: var(--ink);
      background: #ffffff;
    }

    .error {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fde9e7;
      color: var(--danger);
      font-weight: 600;
    }

    .hint-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <section class="register-card">
    <div class="title-row">
      <img class="icon-badge" src="{{ url_for('static', filename='ours-finance-mark.svg') }}" alt="Ours Finance Management logo">
      <div>
        <span class="brand-kicker">Ours Finance Management</span>
        <h1>Create Account</h1>
      </div>
    </div>
    <p>Create your Ours Finance Management account. After signup, your user ID will be shown for future login.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ values.name }}" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ values.email }}" required>
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ values.location }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <div class="actions">
        <a class="back-link" href="{{ url_for('login_page') }}">Back to Login</a>
        <button class="submit-btn" type="submit">Create Account</button>
      </div>
    </form>

    <div class="hint-box">
      After account creation, the login page will show your generated user ID.
    </div>
  </section>
</body>
</html>
